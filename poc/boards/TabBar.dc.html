<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;text-decoration:none;font-size:12px;font-weight:500}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<nav aria-label="Main" style="width: 390px; height: 84px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #EBEBEB; display: flex; padding: 4px 4px 24px; font-family: Figtree, system-ui, sans-serif">
  <a class="tab" href="Home.dc.html" style="color: {{c.home}}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
  <a class="tab" href="Events.dc.html" style="color: {{c.events}}"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Events</a>
  <a class="tab" href="Directory.dc.html" style="color: {{c.directory}}"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"></path></svg>Directory</a>
  <a class="tab" href="Profile.dc.html" style="color: {{c.profile}}"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>Profile</a>
  <a class="tab" href="More.dc.html" style="color: {{c.more}}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>More</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","events","directory","profile","more"],"default":"home"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const c = {};
    ['home', 'events', 'directory', 'profile', 'more'].forEach((k) => { c[k] = k === a ? '#000000' : '#6B6B6B'; });
    return { c };
  }
}
</script>
</body>
</html>
