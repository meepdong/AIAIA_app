<style>
body{margin:0}
a{color:#0067CE}a:hover{color:#003978}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.corner{position:absolute;width:40px;height:40px;border-color:#FFFFFF;border-style:solid;border-width:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0D; font-family: Figtree, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 4px; padding: 12px 16px 8px">

      <h1 style="margin: 0; font-size: 20px; line-height: 27px; font-weight: 700">Check in</h1>
      <span style="font-size: 13px; color: #C9C9C9">[Youth Leadership Camp] · Officers only</span>
    </div>
    <span style="font-size: 14px; color: #C9C9C9">17 / 40</span>
  </header>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: 260px; height: 260px">
      <span class="corner" style="top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 16px"></span>
      <span class="corner" style="top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 16px"></span>
      <span class="corner" style="bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 16px"></span>
      <span class="corner" style="bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 16px"></span>
      <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #8A8A8A">[CAMERA VIEW]</span>
    </div>
  </div>
  <div style="margin: 0 16px; background: #FFFFFF; color: #000000; border-radius: 16px; padding: 16px; display: flex; gap: 12px; align-items: center">
    <span style="width: 48px; height: 48px; border-radius: 9999px; background: #BCE0BB; color: #00490B; display: flex; align-items: center; justify-content: center; flex: none"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"></path></svg></span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <b style="font-weight: 700">Checked in: Oliver B.</b>
      <span style="font-size: 14px; color: #474747">[BRANCH NAME] · Under 18 · guardian notified</span>
    </span>
  </div>
  <div style="padding: 16px 16px 24px; display: flex; gap: 8px">
    <a href="#" style="flex: 1; min-height: 48px; border-radius: 10px; background: #FFFFFF1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; text-decoration: none">Enter code</a>
    <a href="#" style="flex: 1; min-height: 48px; border-radius: 10px; background: #FFFFFF1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; text-decoration: none">Attendee list</a>
  </div>
</div>
</x-dc>
