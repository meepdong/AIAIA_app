<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0067CE}a:hover{color:#003978}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:10px;background:#1B1B1B;color:#FFFFFF;font-weight:600;font-size:16px;text-decoration:none}
.btn:hover{color:#FFFFFF;background:#333333}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:16px;font-weight:500}
.in{min-height:48px;box-sizing:border-box;border:1px solid #848484;border-radius:10px;background:#FFFFFF;padding:0 12px;font:inherit;font-size:16px;display:flex;align-items:center;color:#000000}
.seg{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:15px;font-weight:500}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F1F1F1; font-family: Figtree, system-ui, sans-serif; color: #000000; display: flex; flex-direction: column">
  <div style="padding: 16px 24px 8px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; color: #474747">Step 1 of 2</span>
    <div style="height: 4px; border-radius: 9999px; background: #EBEBEB"><div style="width: 50%; height: 4px; border-radius: 9999px; background: #1B1B1B"></div></div>
    <h1 style="margin: 8px 0 0; font-size: 26px; line-height: 35px; font-weight: 700">Tell us about you</h1>
    <p style="margin: 0; font-size: 16px; line-height: 23px; color: #474747">Your branch's officers check this before you join.</p>
  </div>
  <form style="flex: 1; overflow: auto; padding: 8px 24px; display: flex; flex-direction: column; gap: 16px">
    <div class="f"><label for="fn">Full name</label><input id="fn" class="in" value="Emily Carter"></div>
    <div class="f"><label for="dob">Date of birth</label><input id="dob" class="in" value="14 / 03 / 2007"><span style="font-size: 14px; color: #474747">Under 18? We will ask for a parent or guardian next.</span></div>
    <div class="f"><label for="br">Branch</label><span id="br" class="in" style="justify-content: space-between">[BRANCH NAME]<svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></span></div>
    <div class="f">
      <span style="font-size: 16px; font-weight: 500">Wing</span>
      <div role="radiogroup" aria-label="Wing" style="display: flex; gap: 4px; padding: 4px; background: #0000000F; border-radius: 10px">
        <span role="radio" aria-checked="true" class="seg" style="background: #FFFFFF; box-shadow: 0 1px 2px #00000022">Youth</span>
        <span role="radio" aria-checked="false" class="seg">AIAIA</span>
      </div>
    </div>
    <div class="f"><label for="em">Email (optional)</label><input id="em" class="in" placeholder="name@example.com"></div>
  </form>
  <div style="padding: 16px 24px 24px; border-top: 1px solid #EBEBEB; background: #F1F1F1">
    <a class="btn" href="WaitingRoom.dc.html">Send for approval</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
